version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: language-app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-language_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypw}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./language-app-backend
      dockerfile: Dockerfile
    container_name: language-app-backend
    restart: unless-stopped
    env_file:
      - ./language-app-backend/.env
    environment:
      PORT: ${BACKEND_PORT:-8000}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-mypw}@db:5432/${DB_NAME:-language_db}
      API_ROOT_PATH: ${API_ROOT_PATH:-/language-app-api}
    depends_on:
      - db
    expose:
      - "${BACKEND_PORT:-8000}"

  frontend:
    build:
      context: ./language-app-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}${API_ROOT_PATH:-/language-app-api}
        VITE_APP_BASE_PATH: ${FRONTEND_BASE_PATH:-/language-app-web/}
    container_name: language-app-frontend
    restart: unless-stopped
    environment:
      PORT: ${FRONTEND_PORT:-5173}
    depends_on:
      - backend
    expose:
      - "${FRONTEND_PORT:-5173}"

  reverse-proxy:
    image: nginx:alpine
    container_name: language-app-proxy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data: